name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create deployment directory (allowlist only)
        run: |
          mkdir -p deploy
          # Explicit public web surface only
          for f in index.html work.html contact.html small-business.html 404.html projects.html apps.html \
                   sw.js manifest.json favicon.png CNAME robots.txt sitemap.xml; do
            if [ -f "$f" ]; then cp "$f" deploy/; fi
          done
          # Digital business card at /card/ (orphan utility page — not in main nav)
          if [ -d card ]; then cp -r card deploy/; fi
          cp -r css js images fonts deploy/
          # Do not ship source-only or tooling trees
          rm -f deploy/css/main.css 2>/dev/null || true
          # Keep modular CSS for transparency is fine; bundle.css is what pages load

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './deploy'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
